name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.2"
          cache: pip
      - name: Install pinned development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Tests
        run: python scripts/run_tests.py
      - name: Formatting
        run: python -m ruff format --check .
      - name: Lint
        run: python -m ruff check .
      - name: Typing
        run: python -m mypy
      - name: Validate manual package
        run: python scripts/build_release.py --check
      - name: Build manual package
        run: python scripts/build_release.py
      - uses: actions/upload-artifact@v7
        with:
          name: manual-installation-package
          path: dist/*.zip
          if-no-files-found: error

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master
