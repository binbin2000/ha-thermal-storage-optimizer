name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.2"
          cache: pip
      - name: Install pinned development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Validate release
        run: |
          python scripts/run_tests.py
          python -m ruff format --check .
          python -m ruff check .
          python -m mypy
          python scripts/build_release.py --check
      - name: Verify tag and build package
        shell: bash
        run: |
          version="$(python -c 'from scripts.build_release import release_version; print(release_version())')"
          test "$GITHUB_REF_NAME" = "v$version"
          test -f "docs/release-notes-$version.md"
          python scripts/build_release.py
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*.zip
          --verify-tag
          --title "Thermal Storage Optimizer $GITHUB_REF_NAME"
          --notes-file "docs/release-notes-${GITHUB_REF_NAME#v}.md"
