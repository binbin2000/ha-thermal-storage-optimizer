name: Release

# Two ways to publish the version declared in the repository:
#   - Run this workflow manually from the default branch. It validates the
#     code, then creates the v<version> tag and the GitHub release itself.
#   - Push an annotated v<version> tag. The release is created for that tag.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Require the default branch for a manual release
        if: github.event_name == 'workflow_dispatch'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Run the release workflow from $DEFAULT_BRANCH, not $GITHUB_REF_NAME."
            exit 1
          fi
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.2"
          cache: pip
      - name: Install pinned development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Resolve release tag
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(python -c 'from scripts.build_release import release_version; print(release_version())')"
          tag="v$version"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the declared version $version."
            exit 1
          fi
          if [ ! -f "docs/release-notes-$version.md" ]; then
            echo "::error::docs/release-notes-$version.md is missing."
            exit 1
          fi
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "::error::Release $tag already exists. Bump the version before releasing again."
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] &&
            [ -n "$(git ls-remote --tags origin "refs/tags/$tag")" ]; then
            echo "::error::Tag $tag already exists. Bump the version before releasing again."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Validate release
        run: |
          python scripts/run_tests.py
          python -m ruff format --check .
          python -m ruff check .
          python -m mypy
          python scripts/build_release.py --check
      - name: Build package
        run: python scripts/build_release.py
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # A manual run has no tag yet, so the release creates it at this commit.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag_option=(--target "$GITHUB_SHA")
          else
            tag_option=(--verify-tag)
          fi
          gh release create "$TAG" dist/*.zip "${tag_option[@]}" \
            --title "Thermal Storage Optimizer $TAG" \
            --notes-file "docs/release-notes-$VERSION.md"
